name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Smoke tests (isolated HOME)
        run: |
          export HOME="$(mktemp -d)"
          node tests/smoke.mjs
          node tests/client-smoke.mjs
